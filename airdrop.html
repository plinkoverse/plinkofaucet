<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AIRDROP | Plinkoverse</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/airdrop.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="airdrop-hub">

    <div id="stats-hud">
        <a href="index.html" class="gravity-item" style="color:var(--plink); text-decoration:none;"><- CORE</a>
        <div class="gravity-item" style="margin-top:10px;">RANK: <span id="user-rank">UNASSIGNED</span></div>
    </div>

    <div class="hero">
        <h1 class="gravity-item">AIRDROP PHASE 0</h1>
        <p class="gravity-item">Your loyalty score determines your slice of the 11.5M [PLIK].</p>

        <div class="airdrop-card gravity-item">
            <div id="rank-badge" class="badge-locked">?</div>
            <div class="stats-grid">
                <div><span>STREAK:</span> <b id="display-streak">0</b></div>
                <div><span>TOTAL SAVED:</span> <b id="display-balance">0</b></div>
            </div>
            <button id="check-eligibility" class="claim-button">CALCULATE LOYALTY</button>
        </div>

        <div id="airdrop-status" class="gravity-item" style="margin-top: 30px; display: none;">
            <p id="status-msg">Scanning the ledger...</p>
        </div>
    </div>

    <script src="js/airdrop.js"></script>
</body>
</html>
