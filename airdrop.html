<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP | [PLIK] Eligibility</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/airdrop.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="airdrop-hub">

    <div id="deep-space-bg"></div>

    <div id="stats-hud">
        <div class="gravity-item">RANK: <span id="user-rank" style="color:var(--gold)">UNASSIGNED</span></div>
        <div style="display: flex; gap: 15px; margin-top: 15px; font-size: 0.7rem;">
            <a href="index.html" class="gravity-item" style="color:var(--plink); text-decoration:none;">PORTAL</a>
            <a href="faucet.html" class="gravity-item" style="color:var(--plink); text-decoration:none;">EXTRACTION</a>
            <a href="airdrop.html" class="gravity-item" style="color:var(--plink); text-decoration:none;">AIRDROP</a>
        </div>
    </div>

    <div class="hero">
        <h1 class="gravity-item">PHASE 0 AIRDROP</h1>
        <p class="gravity-item" style="color: #888; max-width: 500px;">Eligibility is calculated based on your Extraction Streak and Session Loyalty.</p>

        <div class="airdrop-card gravity-item" style="margin-top: 30px;">
            <div id="rank-badge" class="badge-locked">?</div>
            <div class="stats-grid">
                <div><span>STREAK:</span> <b id="display-streak" style="color:var(--plink)">0</b></div>
                <div><span>TOTAL:</span> <b id="display-balance" style="color:var(--plink)">0</b></div>
            </div>
            <button id="check-eligibility" class="claim-button" style="width: 100%;">CALCULATE LOYALTY</button>
        </div>

        <div id="airdrop-status" class="gravity-item" style="margin-top: 30px; display: none;">
            <p id="status-msg" style="font-family: monospace; font-size: 0.9rem;">SCANNING LEDGER...</p>
        </div>

        <div style="display: flex; gap: 20px; margin-top: 50px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
            <a href="index.html" class="gravity-item nav-link">PORTAL</a>
            <a href="faucet.html" class="gravity-item nav-link">EXTRACTION</a>
            <a href="airdrop.html" class="gravity-item nav-link" style="color: var(--gold);">AIRDROP</a>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script src="js/airdrop.js"></script>
</body>
</html>
