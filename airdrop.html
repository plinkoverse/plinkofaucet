<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIRDROP | Eligibility</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
</head>
<body>
    <div id="deep-space-bg"></div>

    <div id="scroll-wrapper">
        <div id="stats-hud" class="glass-panel">
            <div class="gravity-item">RESERVE: <span id="display-balance">0.0000</span> [PLIK]</div>
            <nav style="margin-top: 10px;">
                <a href="index.html" class="nav-link">PORTAL</a> | 
                <a href="faucet.html" class="nav-link">EXTRACTION</a> | 
                <a href="airdrop.html" class="nav-link" style="color:var(--gold)">AIRDROP</a>
            </nav>
        </div>

        <div class="container">
            <div class="phase-block glass-panel">
                <div class="agent-id">LOYALTY SCANNER</div>
                <h2>Airdrop Eligibility</h2>
                <p class="fling-text">Your 2026 allocation is calculated based on your total reserve and game performance.</p>
                <div style="background: rgba(255,170,0,0.1); padding: 20px; border-left: 4px solid var(--gold); margin-top: 20px;">
                    <strong>CURRENT RANK:</strong> <span id="rank">UNASSIGNED</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // Read the balance from memory to show it here too
        const balance = localStorage.getItem('plik_balance') || "0.0000";
        document.getElementById('display-balance').innerText = parseFloat(balance).toFixed(4);
    </script>
</body>
</html>
