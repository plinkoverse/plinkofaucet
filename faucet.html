<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXTRACTION | [PLIK] Faucet</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.155.0/three.min.js"></script>
</head>
<body>
    <div id="deep-space-bg"></div>

    <div id="scroll-wrapper">
        <div id="stats-hud" class="glass-panel">
            <div class="gravity-item">RESERVE: <span id="user-balance">0.0000</span> [PLIK]</div>
            <nav style="margin-top: 10px;">
                <a href="index.html" class="nav-link">PORTAL</a> | 
                <a href="faucet.html" class="nav-link" style="color:var(--gold)">EXTRACTION</a> | 
                <a href="airdrop.html" class="nav-link">AIRDROP</a>
            </nav>
        </div>

        <div class="container">
            <div class="phase-block glass-panel" style="text-align: center;">
                <div class="agent-id">REPLENISHMENT PROTOCOL</div>
                <h2>Claim [PLIK]</h2>
                <p class="fling-text">Extract 46.00 coins every 24 hours to build your bankroll for the 2026 manifestation.</p>
                
                <button id="claim-btn" style="padding: 20px 40px; background: var(--accent); border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1.2rem; margin-top: 20px;">
                    INITIALIZE EXTRACTION
                </button>
                <p id="cooldown-timer" style="margin-top: 15px; font-family: monospace; opacity: 0.6;">READY</p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
    <script>
        // FAUCET LOGIC: Saving to Local Storage
        const claimBtn = document.getElementById('claim-btn');
        const balanceDisplay = document.getElementById('user-balance');

        // Load existing balance when page opens
        let balance = parseFloat(localStorage.getItem('plik_balance')) || 0;
        balanceDisplay.innerText = balance.toFixed(4);

        claimBtn.addEventListener('click', () => {
            const lastClaim = localStorage.getItem('last_claim_time') || 0;
            const now = Date.now();
            const waitTime = 24 * 60 * 60 * 1000; // 24 hours in milliseconds

            if (now - lastClaim < waitTime) {
                alert("The Singularity is recharging. Come back later.");
                return;
            }

            // Add 46 coins
            balance += 46;
            balanceDisplay.innerText = balance.toFixed(4);
            
            // Save new balance and time to the browser's "Notebook" (LocalStorage)
            localStorage.setItem('plik_balance', balance);
            localStorage.setItem('last_claim_time', now);
            
            alert("Extraction Successful! +46.00 [PLIK] added to your reserve.");
        });
    </script>
</body>
</html>
