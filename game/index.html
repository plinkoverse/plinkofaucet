<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PLINKOVERSE | GAME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-overlay">
            <div class="stat-box">
                <span class="label">BANKROLL</span>
                <span id="bankroll-display" class="value">23,000,000.00</span>
            </div>
            <div class="stat-box">
                <span class="label">YOUR BALANCE</span>
                <span id="player-balance" class="value">0.00</span> [PLIK]
            </div>
        </div>

        <canvas id="plinko-board"></canvas>

        <div id="controls">
            <div class="bet-control">
                <label>BET AMOUNT</label>
                <input type="number" id="bet-amount" value="10" min="1" max="1000">
            </div>
            <button id="drop-btn">DROP BALL</button>
        </div>
        
        <div id="msg-log"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
